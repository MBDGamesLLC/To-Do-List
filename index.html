<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To Do List</title>
    <style>
        body {
            background-color: rgb(43, 94, 128);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 500px;
            margin: auto;
            margin-top: 50px;
            padding-bottom: 80px;
        }
        h1 {
            color: whitesmoke;
            text-shadow: 0px 0px 10px rgba(0, 0, 0, 0.795);
        }
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid white;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.9);
        }
        button.add-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #111111;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button.add-btn:hover {
            background-color: #222222;
            transform: scale(1.02);
        }
        .clickable-box {
            border: 1px solid white;
            background-color: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-bottom: 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-radius: 4px;
        }
        .clickable-box:hover {
            transform: scale(1.02);
        }
        .task-content {
            display: flex;
            align-items: center;
            flex: 1;
        }
        p {
            color: whitesmoke;
            text-shadow: 0px 0px 5px black;
            font-size: 20px;
            margin: 0;
            word-break: break-word;
        }
        .completed {
            background-color: rgba(0, 0, 0, 0.6) !important;
        }
        .completed p {
            text-decoration: line-through;
            color: #888;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .delete-btn {
            background-color: #111111;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background-color: #333333;
            border-color: white;
        }
        .reorder-btn {
            background-color: #111111;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .reorder-btn:hover {
            background-color: #333333;
            border-color: white;
        }
        .reorder-btn:disabled {
            background-color: rgba(17, 17, 17, 0.4);
            color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }
        .undo-banner {
            position: fixed;
            bottom: -70px; 
            left: 50%;
            transform: translateX(-50%);
            background-color: #111111;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: bottom 0.4s ease;
            z-index: 1000;
        }
        .undo-banner.show {
            bottom: 25px; 
        }
        .undo-btn {
            background-color: white;
            color: black;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .undo-btn:hover {
            background-color: #dddddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Homework To Do List</h1>
        
        <div class="input-section">
            <input type="text" id="task-input" placeholder="Add a new homework assignment...">
            <button class="add-btn" id="add-button">Add</button>
        </div>
        
        <div id="list-container"></div>
    </div>

    <div id="undo-toast" class="undo-banner">
        <span>Task deleted.</span>
        <button id="undo-action-btn" class="undo-btn">Undo</button>
    </div>

    <script>
        const defaultTasks = [
            { text: "Week 3 Reflection, Sci-Fi, Due Sep 9th", completed: false },
            { text: "Special Topics Proposal 1-2 page min, Due Sep 10th", completed: false },
            { text: "Multiplayer Game Research, GIMM 400, Due Sep 11th", completed: false },
            { text: "RCIM Certificate, Sci-Fi, Due Sep 26, but get done soon, it takes about 3 hours", completed: false }
        ];

        let myTasks = JSON.parse(localStorage.getItem("homeworkTasks"));
        
        if (!myTasks) {
            myTasks = defaultTasks;
            saveToStorage();
        }

        let lastDeletedTask = null;
        let lastDeletedIndex = null;
        let undoTimeoutToken = null;

        const container = document.getElementById("list-container");
        const taskInput = document.getElementById("task-input");
        const addButton = document.getElementById("add-button");
        const undoToast = document.getElementById("undo-toast");
        const undoActionBtn = document.getElementById("undo-action-btn");

        function saveToStorage() {
            localStorage.setItem("homeworkTasks", JSON.stringify(myTasks));
        }

        function renderTasks() {
            container.innerHTML = ""; 
            
            myTasks.forEach(function(taskObj, index) {
                const taskDiv = document.createElement("div");
                taskDiv.className = "clickable-box";
                if (taskObj.completed) {
                    taskDiv.classList.add("completed");
                }
                
                taskDiv.innerHTML = `
                    <div class="task-content">
                        <p>${taskObj.text}</p>
                    </div>
                    <div class="controls-group">
                        <button class="reorder-btn move-up" ${index === 0 ? 'disabled' : ''}>▲</button>
                        <button class="reorder-btn move-down" ${index === myTasks.length - 1 ? 'disabled' : ''}>▼</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                `;
                
                taskDiv.addEventListener("click", function(e) {
                    if (e.target.closest(".controls-group")) return;
                    
                    taskObj.completed = !taskObj.completed;
                    taskDiv.classList.toggle("completed");
                    saveToStorage();
                });

                const upBtn = taskDiv.querySelector(".move-up");
                upBtn.addEventListener("click", function() {
                    if (index > 0) {
                        swapTasks(index, index - 1);
                    }
                });

                const downBtn = taskDiv.querySelector(".move-down");
                downBtn.addEventListener("click", function() {
                    if (index < myTasks.length - 1) {
                        swapTasks(index, index + 1);
                    }
                });

                const deleteBtn = taskDiv.querySelector(".delete-btn");
                deleteBtn.addEventListener("click", function() {
                    lastDeletedTask = myTasks[index];
                    lastDeletedIndex = index;

                    myTasks.splice(index, 1); 
                    saveToStorage();
                    renderTasks(); 
                    triggerUndoBanner();
                });

                container.appendChild(taskDiv);
            });
        }

        function swapTasks(idxA, idxB) {
            const temp = myTasks[idxA];
            myTasks[idxA] = myTasks[idxB];
            myTasks[idxB] = temp;
            saveToStorage();
            renderTasks();
        }

        function triggerUndoBanner() {
            clearTimeout(undoTimeoutToken);
            undoToast.classList.add("show");
            undoTimeoutToken = setTimeout(function() {
                undoToast.classList.remove("show");
            }, 6000);
        }

        undoActionBtn.addEventListener("click", function() {
            if (lastDeletedTask !== null && lastDeletedIndex !== null) {
                myTasks.splice(lastDeletedIndex, 0, lastDeletedTask);
                saveToStorage();
                renderTasks();
                lastDeletedTask = null;
                lastDeletedIndex = null;
                undoToast.classList.remove("show");
            }
        });

        function handleAddTask() {
            const text = taskInput.value.trim();
            if (text !== "") {
                myTasks.push({ text: text, completed: false });
                saveToStorage();
                renderTasks();
                taskInput.value = ""; 
            }
        }

        addButton.addEventListener("click", handleAddTask);
        taskInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            handleAddTask();
        }
    });
    renderTasks();
    </script>

</body>
</html>
