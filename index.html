<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Dynamic To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Playfair+Display:wght@400;700&family=Roboto+Mono&family=Caveat:wght@600&family=Merriweather&family=Bebas+Neue&family=Quicksand:wght@500&family=Pacifico&family=Dancing+Script:wght@600&family=Fredoka:wght@500&family=Baloo+2:wght@600&family=Comfortaa:wght@500&family=Nunito:wght@500&family=Indie+Flower&family=Shadows+Into+Light&family=Chewy&family=Gochi+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b5e80;
            --text-color: whitesmoke;
            --font-family: sans-serif;
            --text-shadow: 0px 0px 10px rgba(0, 0, 0, 0.795);
            --p-text-shadow: 0px 0px 5px black;
            --task-bg-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 100px 16px;
        }

        .header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--text-color);
            text-shadow: var(--text-shadow);
            font-size: clamp(22px, 6vw, 32px);
            margin: 0;
            flex: 1;
            word-break: break-word;
            cursor: text;
            border-bottom: 2px dashed transparent;
        }

        h1:hover {
            border-bottom: 2px dashed rgba(255, 255, 255, 0.5);
        }

        #title-input {
            font-size: clamp(22px, 6vw, 32px);
            font-family: var(--font-family);
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid white;
            border-radius: 4px;
            padding: 2px 6px;
            width: 100%;
            flex: 1;
        }

        .icon-btn {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: var(--text-color);
            border-radius: 8px;
            width: 44px;
            height: 44px;
            min-width: 44px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background-color: rgba(0, 0, 0, 0.5);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"]#task-input {
            flex: 1 1 200px;
            min-width: 0;
            padding: 12px;
            font-size: 16px;
            border: 1px solid white;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.9);
            font-family: var(--font-family);
        }

        button.add-btn {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #111111;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
            min-height: 44px;
        }

        button.add-btn:hover {
            background-color: #222222;
            transform: scale(1.02);
        }

        .clickable-box {
            border: 1px solid rgba(255, 255, 255, 0.7);
            background-color: var(--task-bg-color);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-radius: 4px;
            gap: 10px;
        }

        .clickable-box:hover {
            transform: scale(1.01);
        }

        .task-content {
            display: flex;
            align-items: center;
            flex: 1 1 100%;
            min-width: 0;
        }

        p {
            color: var(--text-color);
            text-shadow: var(--p-text-shadow);
            font-size: 18px;
            font-family: var(--font-family);
            margin: 0;
            word-break: break-word;
        }

        .completed {
            background-color: rgba(0, 0, 0, 0.6) !important;
        }

        .completed p {
            text-decoration: line-through;
            color: #888;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .delete-btn, .reorder-btn {
            background-color: #111111;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            min-height: 40px;
            font-size: 13px;
        }

        .delete-btn:hover, .reorder-btn:hover {
            background-color: #333333;
            border-color: white;
        }

        .reorder-btn:disabled {
            background-color: rgba(17, 17, 17, 0.4);
            color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }

        .undo-banner {
            position: fixed;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #111111;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: bottom 0.4s ease;
            z-index: 1000;
            max-width: 90%;
        }

        .undo-banner.show {
            bottom: 25px;
        }

        .undo-btn {
            background-color: white;
            color: black;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .undo-btn:hover {
            background-color: #dddddd;
        }

        /* Settings panel */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1500;
        }

        .settings-overlay.show {
            display: block;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            max-width: 85vw;
            height: 100%;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            box-shadow: -4px 0px 20px rgba(0, 0, 0, 0.6);
            transition: right 0.3s ease;
            z-index: 2000;
            overflow-y: auto;
        }

        .settings-panel.show {
            right: 0;
        }

        .settings-panel h2 {
            margin-top: 0;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-panel .close-settings {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .setting-group {
            margin-bottom: 22px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
        }

        .setting-group input[type="color"] {
            width: 100%;
            height: 44px;
            border: 1px solid #555;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }

        .color-picker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .wheel-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            touch-action: none;
        }

        .color-wheel {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        .wheel-pointer {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.8), inset 0 0 2px rgba(0,0,0,0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .brightness-slider {
            width: 100%;
            height: 20px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            outline: none;
        }

        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            cursor: pointer;
        }

        .brightness-slider::-moz-range-thumb {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            cursor: pointer;
        }

        .color-picker-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .color-swatch {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .hex-input {
            flex: 1;
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #2a2a2a;
            color: white;
            min-width: 0;
        }

        .setting-group select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #2a2a2a;
            color: white;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background-color: #555;
        }

        @media (max-width: 400px) {
            .container {
                padding: 14px 10px 100px 10px;
            }
            .controls-group {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1 id="title-display">To Do List</h1>
            <input type="text" id="title-input" style="display:none;">
            <button class="icon-btn" id="settings-toggle" title="Settings">⚙️</button>
        </div>

        <div class="input-section">
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button class="add-btn" id="add-button">Add</button>
        </div>

        <div id="list-container"></div>
    </div>

    <div id="undo-toast" class="undo-banner">
        <span>Task deleted.</span>
        <button id="undo-action-btn" class="undo-btn">Undo</button>
    </div>

    <div class="settings-overlay" id="settings-overlay"></div>
    <div class="settings-panel" id="settings-panel">
        <h2>Settings <button class="close-settings" id="close-settings">&times;</button></h2>

        <div class="setting-group">
            <label>Background color</label>
            <div class="color-picker">
                <div class="wheel-wrap">
                    <canvas class="color-wheel" id="bg-wheel" width="160" height="160"></canvas>
                    <div class="wheel-pointer" id="bg-pointer"></div>
                </div>
                <input type="range" class="brightness-slider" id="bg-slider" min="0" max="100" value="100">
                <div class="color-picker-footer">
                    <div class="color-swatch" id="bg-swatch"></div>
                    <input type="text" class="hex-input" id="bg-hex" maxlength="7" value="#2b5e80">
                </div>
            </div>
            <input type="hidden" id="bg-color-input" value="#2b5e80">
        </div>

        <div class="setting-group">
            <label>Text color</label>
            <div class="color-picker">
                <div class="wheel-wrap">
                    <canvas class="color-wheel" id="text-wheel" width="160" height="160"></canvas>
                    <div class="wheel-pointer" id="text-pointer"></div>
                </div>
                <input type="range" class="brightness-slider" id="text-slider" min="0" max="100" value="100">
                <div class="color-picker-footer">
                    <div class="color-swatch" id="text-swatch"></div>
                    <input type="text" class="hex-input" id="text-hex" maxlength="7" value="#f5f5f5">
                </div>
            </div>
            <input type="hidden" id="text-color-input" value="#f5f5f5">
        </div>

        <div class="setting-group">
            <label>Task background color</label>
            <div class="color-picker">
                <div class="wheel-wrap">
                    <canvas class="color-wheel" id="taskbg-wheel" width="160" height="160"></canvas>
                    <div class="wheel-pointer" id="taskbg-pointer"></div>
                </div>
                <input type="range" class="brightness-slider" id="taskbg-slider" min="0" max="100" value="100">
                <div class="color-picker-footer">
                    <div class="color-swatch" id="taskbg-swatch"></div>
                    <input type="text" class="hex-input" id="taskbg-hex" maxlength="7" value="#ffffff">
                </div>
            </div>
            <input type="hidden" id="task-bg-color-input" value="#ffffff">
        </div>

        <div class="setting-group">
            <label class="toggle-label" for="shadow-toggle" style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                <input type="checkbox" id="shadow-toggle" checked style="width:20px; height:20px; cursor:pointer;">
                <span>Enable text shadow</span>
            </label>
        </div>

        <div class="setting-group">
            <label for="font-select">Font style</label>
            <select id="font-select">
                <optgroup label="System fonts">
                    <option value="sans-serif">Sans Serif</option>
                    <option value="Georgia, serif">Serif (Georgia)</option>
                    <option value="'Courier New', monospace">Monospace</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                </optgroup>
                <optgroup label="Google Fonts">
                    <option value="'Poppins', sans-serif">Poppins</option>
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Roboto Mono', monospace">Roboto Mono</option>
                    <option value="'Caveat', cursive">Caveat (handwritten)</option>
                    <option value="'Merriweather', serif">Merriweather</option>
                    <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                    <option value="'Quicksand', sans-serif">Quicksand</option>
                </optgroup>
                <optgroup label="Cute / Handwritten">
                    <option value="'Pacifico', cursive">Pacifico</option>
                    <option value="'Dancing Script', cursive">Dancing Script</option>
                    <option value="'Fredoka', sans-serif">Fredoka</option>
                    <option value="'Baloo 2', cursive">Baloo 2</option>
                    <option value="'Comfortaa', sans-serif">Comfortaa</option>
                    <option value="'Nunito', sans-serif">Nunito</option>
                    <option value="'Indie Flower', cursive">Indie Flower</option>
                    <option value="'Shadows Into Light', cursive">Shadows Into Light</option>
                    <option value="'Chewy', cursive">Chewy</option>
                    <option value="'Gochi Hand', cursive">Gochi Hand</option>
                </optgroup>
            </select>
        </div>

        <button class="reset-btn" id="reset-settings-btn">Reset to defaults</button>
    </div>

    <script>
        // Persistence: this saves your tasks, title, and appearance settings
        // using this artifact's built-in storage, so they'll still be here
        // next time you open this artifact in Claude.ai. (This storage API
        // is specific to Claude artifacts — if you download this file and
        // open it as a plain HTML file elsewhere, saving is skipped and
        // everything just lives in memory for that session instead.)

        const DATA_KEY = "todo-data";
        const SETTINGS_KEY = "todo-settings";

        const defaultTasks = [
            { text: "Week 3 Reflection, Sci-Fi, Due Sep 9th", completed: false },
            { text: "Special Topics Proposal 1-2 page min, Due Sep 10th", completed: false },
            { text: "Multiplayer Game Research, GIMM 400, Due Sep 11th", completed: false },
            { text: "RCIM Certificate, Sci-Fi, Due Sep 26, but get done soon, it takes about 3 hours", completed: false }
        ];

        const defaultSettings = {
            bgColor: "#2b5e80",
            textColor: "#f5f5f5",
            taskBgColor: "#ffffff",
            font: "sans-serif",
            shadowEnabled: true
        };

        let myTasks = defaultTasks.map(t => ({ ...t }));
        let currentTitle = "Homework To Do List";

        let lastDeletedTask = null;
        let lastDeletedIndex = null;
        let undoTimeoutToken = null;

        const container = document.getElementById("list-container");
        const taskInput = document.getElementById("task-input");
        const addButton = document.getElementById("add-button");
        const undoToast = document.getElementById("undo-toast");
        const undoActionBtn = document.getElementById("undo-action-btn");

        const titleDisplay = document.getElementById("title-display");
        const titleInput = document.getElementById("title-input");

        const settingsToggle = document.getElementById("settings-toggle");
        const settingsPanel = document.getElementById("settings-panel");
        const settingsOverlay = document.getElementById("settings-overlay");
        const closeSettings = document.getElementById("close-settings");
        const bgColorInput = document.getElementById("bg-color-input");
        const textColorInput = document.getElementById("text-color-input");
        const taskBgColorInput = document.getElementById("task-bg-color-input");
        const shadowToggle = document.getElementById("shadow-toggle");
        const fontSelect = document.getElementById("font-select");
        const resetSettingsBtn = document.getElementById("reset-settings-btn");

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- Color conversion helpers ---
        function hsvToRgb(h, s, v) {
            const c = v * s;
            const hh = h / 60;
            const x = c * (1 - Math.abs((hh % 2) - 1));
            let r = 0, g = 0, b = 0;
            if (hh >= 0 && hh < 1) { r = c; g = x; b = 0; }
            else if (hh >= 1 && hh < 2) { r = x; g = c; b = 0; }
            else if (hh >= 2 && hh < 3) { r = 0; g = c; b = x; }
            else if (hh >= 3 && hh < 4) { r = 0; g = x; b = c; }
            else if (hh >= 4 && hh < 5) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            const m = v - c;
            return [
                Math.round((r + m) * 255),
                Math.round((g + m) * 255),
                Math.round((b + m) * 255)
            ];
        }

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0;
            if (d !== 0) {
                if (max === r) h = ((g - b) / d) % 6;
                else if (max === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
                if (h < 0) h += 360;
            }
            const s = max === 0 ? 0 : d / max;
            const v = max;
            return { h, s, v };
        }

        function hexToRgb(hex) {
            const clean = hex.replace('#', '');
            return {
                r: parseInt(clean.substring(0, 2), 16),
                g: parseInt(clean.substring(2, 4), 16),
                b: parseInt(clean.substring(4, 6), 16)
            };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
        }

        function hsvToHex(h, s, v) {
            const [r, g, b] = hsvToRgb(h, s, v);
            return rgbToHex(r, g, b);
        }

        // --- Color wheel rendering (same gradient reused for every picker) ---
        const WHEEL_SIZE = 160;
        const WHEEL_RADIUS = WHEEL_SIZE / 2;

        function buildWheelImageData() {
            const imgData = new ImageData(WHEEL_SIZE, WHEEL_SIZE);
            for (let y = 0; y < WHEEL_SIZE; y++) {
                for (let x = 0; x < WHEEL_SIZE; x++) {
                    const dx = x - WHEEL_RADIUS + 0.5;
                    const dy = y - WHEEL_RADIUS + 0.5;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const idx = (y * WHEEL_SIZE + x) * 4;
                    if (dist <= WHEEL_RADIUS) {
                        let angle = Math.atan2(dy, dx);
                        let hue = (angle * 180 / Math.PI + 360) % 360;
                        let sat = Math.min(dist / WHEEL_RADIUS, 1);
                        const [r, g, b] = hsvToRgb(hue, sat, 1);
                        imgData.data[idx] = r;
                        imgData.data[idx + 1] = g;
                        imgData.data[idx + 2] = b;
                        imgData.data[idx + 3] = 255;
                    } else {
                        imgData.data[idx + 3] = 0;
                    }
                }
            }
            return imgData;
        }

        const wheelImageData = buildWheelImageData();

        function initColorPicker(prefix, hiddenInput, initialHex) {
            const canvas = document.getElementById(prefix + '-wheel');
            const pointer = document.getElementById(prefix + '-pointer');
            const slider = document.getElementById(prefix + '-slider');
            const hexInput = document.getElementById(prefix + '-hex');
            const swatch = document.getElementById(prefix + '-swatch');
            const ctx = canvas.getContext('2d');
            ctx.putImageData(wheelImageData, 0, 0);

            let hue = 0, sat = 0, val = 1;

            function updateUI() {
                const radius = sat * WHEEL_RADIUS;
                const angle = hue * Math.PI / 180;
                pointer.style.left = (WHEEL_RADIUS + radius * Math.cos(angle)) + 'px';
                pointer.style.top = (WHEEL_RADIUS + radius * Math.sin(angle)) + 'px';
                slider.value = Math.round(val * 100);
                const hex = hsvToHex(hue, sat, val);
                hexInput.value = hex;
                swatch.style.backgroundColor = hex;
                const fullColor = hsvToHex(hue, sat, 1);
                slider.style.background = `linear-gradient(to right, #000, ${fullColor})`;
            }

            function commit() {
                const hex = hsvToHex(hue, sat, val);
                hiddenInput.value = hex;
                hiddenInput.dispatchEvent(new Event('input'));
            }

            function setFromHex(hex) {
                const rgb = hexToRgb(hex);
                const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
                hue = hsv.h; sat = hsv.s; val = hsv.v;
                updateUI();
            }

            function handlePointerEvent(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const dx = x - WHEEL_RADIUS;
                const dy = y - WHEEL_RADIUS;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > WHEEL_RADIUS) dist = WHEEL_RADIUS;
                hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
                sat = dist / WHEEL_RADIUS;
                updateUI();
                commit();
            }

            let dragging = false;
            canvas.addEventListener('pointerdown', function(e) {
                dragging = true;
                canvas.setPointerCapture(e.pointerId);
                handlePointerEvent(e);
            });
            canvas.addEventListener('pointermove', function(e) {
                if (dragging) handlePointerEvent(e);
            });
            canvas.addEventListener('pointerup', function() { dragging = false; });
            canvas.addEventListener('pointercancel', function() { dragging = false; });

            slider.addEventListener('input', function() {
                val = slider.value / 100;
                updateUI();
                commit();
            });

            hexInput.addEventListener('change', function() {
                let hex = hexInput.value.trim();
                if (hex && !hex.startsWith('#')) hex = '#' + hex;
                if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                    setFromHex(hex);
                    commit();
                } else {
                    hexInput.value = hsvToHex(hue, sat, val);
                }
            });

            setFromHex(initialHex);

            return { setFromHex };
        }

        const bgPicker = initColorPicker("bg", bgColorInput, bgColorInput.value);
        const textPicker = initColorPicker("text", textColorInput, textColorInput.value);
        const taskBgPicker = initColorPicker("taskbg", taskBgColorInput, taskBgColorInput.value);

        // --- Storage adapter ---
        // Uses Claude's built-in artifact storage when running inside Claude.ai.
        // Falls back to the browser's own localStorage anywhere else (e.g. a
        // GitHub Pages site), so saving still works once this file is hosted
        // on its own.
        async function storageGet(key) {
            if (typeof window !== "undefined" && window.storage) {
                try {
                    const result = await window.storage.get(key);
                    return result ? result.value : null;
                } catch (err) {
                    return null;
                }
            }
            try {
                return localStorage.getItem(key);
            } catch (err) {
                return null;
            }
        }

        async function storageSet(key, value) {
            if (typeof window !== "undefined" && window.storage) {
                try {
                    await window.storage.set(key, value);
                } catch (err) {
                    console.error("Could not save (artifact storage):", err);
                }
                return;
            }
            try {
                localStorage.setItem(key, value);
            } catch (err) {
                console.error("Could not save (localStorage):", err);
            }
        }

        async function saveData() {
            await storageSet(DATA_KEY, JSON.stringify({ title: currentTitle, tasks: myTasks }));
        }

        async function saveSettings(settings) {
            await storageSet(SETTINGS_KEY, JSON.stringify(settings));
        }

        function currentSettingsFromInputs() {
            return {
                bgColor: bgColorInput.value,
                textColor: textColorInput.value,
                taskBgColor: taskBgColorInput.value,
                font: fontSelect.value,
                shadowEnabled: shadowToggle.checked
            };
        }

        function applySettings(settings) {
            document.documentElement.style.setProperty("--bg-color", settings.bgColor);
            document.documentElement.style.setProperty("--text-color", settings.textColor);
            document.documentElement.style.setProperty("--font-family", settings.font);
            document.documentElement.style.setProperty("--task-bg-color", hexToRgba(settings.taskBgColor, 0.15));
            document.documentElement.style.setProperty("--text-shadow", settings.shadowEnabled ? "0px 0px 10px rgba(0, 0, 0, 0.795)" : "none");
            document.documentElement.style.setProperty("--p-text-shadow", settings.shadowEnabled ? "0px 0px 5px black" : "none");

            bgColorInput.value = settings.bgColor;
            textColorInput.value = settings.textColor;
            taskBgColorInput.value = settings.taskBgColor;
            shadowToggle.checked = settings.shadowEnabled;
            fontSelect.value = settings.font;

            if (typeof bgPicker !== "undefined") bgPicker.setFromHex(settings.bgColor);
            if (typeof textPicker !== "undefined") textPicker.setFromHex(settings.textColor);
            if (typeof taskBgPicker !== "undefined") taskBgPicker.setFromHex(settings.taskBgColor);
        }

        function renderTasks() {
            container.innerHTML = "";

            myTasks.forEach(function(taskObj, index) {
                const taskDiv = document.createElement("div");
                taskDiv.className = "clickable-box";
                if (taskObj.completed) {
                    taskDiv.classList.add("completed");
                }

                taskDiv.innerHTML = `
                    <div class="task-content">
                        <p>${taskObj.text}</p>
                    </div>
                    <div class="controls-group">
                        <button class="reorder-btn move-up" ${index === 0 ? 'disabled' : ''}>▲</button>
                        <button class="reorder-btn move-down" ${index === myTasks.length - 1 ? 'disabled' : ''}>▼</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                `;

                taskDiv.addEventListener("click", function(e) {
                    if (e.target.closest(".controls-group")) return;

                    taskObj.completed = !taskObj.completed;
                    taskDiv.classList.toggle("completed");
                    saveData();
                });

                const upBtn = taskDiv.querySelector(".move-up");
                upBtn.addEventListener("click", function() {
                    if (index > 0) {
                        swapTasks(index, index - 1);
                    }
                });

                const downBtn = taskDiv.querySelector(".move-down");
                downBtn.addEventListener("click", function() {
                    if (index < myTasks.length - 1) {
                        swapTasks(index, index + 1);
                    }
                });

                const deleteBtn = taskDiv.querySelector(".delete-btn");
                deleteBtn.addEventListener("click", function() {
                    lastDeletedTask = myTasks[index];
                    lastDeletedIndex = index;

                    myTasks.splice(index, 1);
                    renderTasks();
                    saveData();
                    triggerUndoBanner();
                });

                container.appendChild(taskDiv);
            });
        }

        function swapTasks(idxA, idxB) {
            const temp = myTasks[idxA];
            myTasks[idxA] = myTasks[idxB];
            myTasks[idxB] = temp;
            renderTasks();
            saveData();
        }

        function triggerUndoBanner() {
            clearTimeout(undoTimeoutToken);
            undoToast.classList.add("show");
            undoTimeoutToken = setTimeout(function() {
                undoToast.classList.remove("show");
            }, 6000);
        }

        undoActionBtn.addEventListener("click", function() {
            if (lastDeletedTask !== null && lastDeletedIndex !== null) {
                myTasks.splice(lastDeletedIndex, 0, lastDeletedTask);
                renderTasks();
                saveData();
                lastDeletedTask = null;
                lastDeletedIndex = null;
                undoToast.classList.remove("show");
            }
        });

        function handleAddTask() {
            const text = taskInput.value.trim();
            if (text !== "") {
                myTasks.push({ text: text, completed: false });
                renderTasks();
                saveData();
                taskInput.value = "";
            }
        }

        addButton.addEventListener("click", handleAddTask);
        taskInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                handleAddTask();
            }
        });

        // --- Editable title ---
        titleDisplay.addEventListener("click", function() {
            titleInput.value = titleDisplay.textContent;
            titleDisplay.style.display = "none";
            titleInput.style.display = "block";
            titleInput.focus();
            titleInput.select();
        });

        function saveTitle() {
            const newTitle = titleInput.value.trim();
            if (newTitle !== "") {
                currentTitle = newTitle;
                titleDisplay.textContent = newTitle;
                saveData();
            }
            titleInput.style.display = "none";
            titleDisplay.style.display = "block";
        }

        titleInput.addEventListener("blur", saveTitle);
        titleInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                titleInput.blur();
            }
        });

        // --- Settings panel ---
        function openSettings() {
            settingsPanel.classList.add("show");
            settingsOverlay.classList.add("show");
        }

        function closeSettingsPanel() {
            settingsPanel.classList.remove("show");
            settingsOverlay.classList.remove("show");
        }

        settingsToggle.addEventListener("click", openSettings);
        closeSettings.addEventListener("click", closeSettingsPanel);
        settingsOverlay.addEventListener("click", closeSettingsPanel);

        bgColorInput.addEventListener("input", function() {
            document.documentElement.style.setProperty("--bg-color", bgColorInput.value);
            saveSettings(currentSettingsFromInputs());
        });

        textColorInput.addEventListener("input", function() {
            document.documentElement.style.setProperty("--text-color", textColorInput.value);
            saveSettings(currentSettingsFromInputs());
        });

        fontSelect.addEventListener("change", function() {
            document.documentElement.style.setProperty("--font-family", fontSelect.value);
            saveSettings(currentSettingsFromInputs());
        });

        taskBgColorInput.addEventListener("input", function() {
            document.documentElement.style.setProperty("--task-bg-color", hexToRgba(taskBgColorInput.value, 0.15));
            saveSettings(currentSettingsFromInputs());
        });

        shadowToggle.addEventListener("change", function() {
            if (shadowToggle.checked) {
                document.documentElement.style.setProperty("--text-shadow", "0px 0px 10px rgba(0, 0, 0, 0.795)");
                document.documentElement.style.setProperty("--p-text-shadow", "0px 0px 5px black");
            } else {
                document.documentElement.style.setProperty("--text-shadow", "none");
                document.documentElement.style.setProperty("--p-text-shadow", "none");
            }
            saveSettings(currentSettingsFromInputs());
        });

        resetSettingsBtn.addEventListener("click", function() {
            applySettings(defaultSettings);
            saveSettings(defaultSettings);
        });

        // --- Load saved state, then render ---
        async function loadState() {
            try {
                const dataValue = await storageGet(DATA_KEY);
                if (dataValue) {
                    const parsed = JSON.parse(dataValue);
                    if (Array.isArray(parsed.tasks)) myTasks = parsed.tasks;
                    if (typeof parsed.title === "string") currentTitle = parsed.title;
                }
            } catch (err) {
                // no saved data yet — defaults are already in place
            }

            try {
                const settingsValue = await storageGet(SETTINGS_KEY);
                if (settingsValue) {
                    const parsedSettings = JSON.parse(settingsValue);
                    applySettings({ ...defaultSettings, ...parsedSettings });
                } else {
                    applySettings(defaultSettings);
                }
            } catch (err) {
                applySettings(defaultSettings);
            }

            titleDisplay.textContent = currentTitle;
            renderTasks();
        }

        loadState();
    </script>

</body>
</html>
